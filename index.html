<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>선물 페이지</title>

  <!-- 카카오 SDK -->
  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
</head>

<body style="text-align:center; font-family:sans-serif; margin-top:50px;">

  <h1>🎁 선물 도착!</h1>
  <p>아래 이미지를 눌러 확인하세요</p>

  <a href="https://malmong.github.io/banner.jpg">
    <img src="https://malmong.github.io/banner.jpg" width="300">
  </a>

  <br><br>

  <button onclick="sendLink()" 
          style="padding:12px 20px; font-size:16px; cursor:pointer;">
    친구에게 보내기
  </button>

  <script>
    Kakao.init('72d6704def40e268e1835d742ac6f31c');

    function sendLink() {
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: '또 속니 병신아ㅋㅋㅋㅋㅋㅋㅋ',
          description: '아이 재밌어~~~',
          imageUrl: 'https://malmong.github.io/banner.jpg',
          link: {
            mobileWebUrl: 'https://malmong.github.io',
            webUrl: 'https://malmong.github.io'
          }
        }
      });
    }
  </script>

</body>
</html>
